# Values like ${POSTGRES_PASSWORD} are read from the .env file next to this one.
# That .env is gitignored; copy .env.example to .env to get started.
name: backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # Only applied when the data volume is first created.
      # To change it later: ALTER USER ... PASSWORD '...' (or wipe the volume).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432' # host port, for running the API locally or a DB client
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network  
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass # clients must AUTH with this password
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - app-network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD} # used by the healthcheck below
    volumes:
      - redis_data:/data
    healthcheck:
      # $$ = read the variable inside the container, not from compose
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    environment:
      PORT: 3000
      # Inside Docker, services reach each other by service name on their default ports.
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${API_PORT}:3000'
    networks:
      - app-network    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
